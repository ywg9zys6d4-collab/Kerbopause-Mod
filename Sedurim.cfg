// Save this file as: Sedurim.cfg (Keep it in your root directory next to textures)
@Kopernicus:FOR[Kerbopause-Mod]
{
    Body
    {
        name = Sedurim
        cacheFile = Kerbopause-Mod/Sedurim.bin
        
        Template
        {
            name = Eeloo 
            removeAllPQSMods = true
        }
        
        Properties
        {
            displayName = Sedurim^N
            description = Stumbled upon by sheer accident during an aggressive 10-G Joolian atmospheric slingshot, Sedurim is a frozen sentinel lingering at the absolute edge of the Kerbopause. Its surface is scarred by ancient tholins and deep volcanic veins, serving as a quiet warning of the massive gravitational disruptions occurring out in the deep freeze of the Kerman Cloud.
            radius = 100000 
            geeASL = 0.05 
            rotationPeriod = 32000
            tidallyLocked = false
            isHomeWorld = false
            timewarpAltitudeLimits = 0 2000 5000 10000 20000 50000 100000 200000
            
            ScienceValues
            {
                landedDataValue = 14
                inSpaceLowDataValue = 11
                inSpaceHighDataValue = 9
                recoveryValue = 12
                spaceAltitudeThreshold = 30000 
            }
        }
        
        Orbit
        {
            referenceBody = Sun 
            inclination = 11.93 
            eccentricity = 0.857 
            semiMajorAxis = 760000000000 
            longitudeOfAscendingNode = 135
            argumentOfPeriapsis = 311
            meanAnomalyAtEpoch = 0
            epoch = 0
            color = 0.43, 0.28, 0.24, 1.0 
        }
        
        ScaledVersion
        {
            type = Vacuum
            fadeStart = 20000
            fadeEnd = 30000
            
            Material
            {
                texture = Kerbopause-Mod/SedurimClr
                normals = Kerbopause-Mod/SedurimNrm
                shininess = 0.05
                specular = 0.05, 0.05, 0.05, 1.0
            }
        }
        
        PQS
        {
            fadeStart = 20000
            fadeEnd = 30000
            deactivateAltitude = 40000
            minLevel = 2
            maxLevel = 8
            
            Mods
            {
                VertexHeightMap
                {
                    map = Kerbopause-Mod/SedurimHeight
                    offset = 0
                    deformity = 3200 
                    scaleDeformityByRadius = false
                    order = 10
                    enabled = true
                }
                
                VertexColorMap
                {
                    map = Kerbopause-Mod/SedurimClr
                    order = 20
                    enabled = true
                }
            }
        }
    }

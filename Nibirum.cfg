// Save this file as: Nibirum.cfg (Keep it in your root directory next to your texture)
@Kopernicus:FOR[Kerbopause-Mod]
{
    Body
    {
        name = Nibirum
        cacheFile = Kerbopause-Mod/Nibirum.bin
        
        Template
        {
            name = Jool // Uses Jool as a baseline template for a massive gas giant
            removeAllPQSMods = true
        }
        
        Properties
        {
            displayName = Nibirum^N
            description = A massive, rogue intergalactic world-killer radiating intense, chaotic infrared heat signatures. Nibirum has violently ripped through the 1 KLY Kerman Cloud and the red Kerbopause boundary, sending gravitational shockwaves across the entire system as it falls directly toward the inner planets.
            radius = 6000000 // Colossal gas giant scale matching Jool's size
            geeASL = 1.7 // High gravity to pull in massive asteroid swarms and disrupt orbits
            rotationPeriod = 36000
            isHomeWorld = false
            timewarpAltitudeLimits = 0 10000 20000 50000 100000 200000 500000 1000000
            
            ScienceValues
            {
                inSpaceLowDataValue = 15
                inSpaceHighDataValue = 12
                recoveryValue = 13
                spaceAltitudeThreshold = 4000000
            }
        }
        
        Orbit
        {
            referenceBody = Sun 
            inclination = 23.45 // Heavily tilted, hyper-chaotic doomsday path
            eccentricity = 0.985 // Virtually a straight-line drop directly into the inner system
            semiMajorAxis = 900000000000 // Starts out right at the edge of the broken Kerbopause
            longitudeOfAscendingNode = 45
            argumentOfPeriapsis = 90
            meanAnomalyAtEpoch = 0
            epoch = 0
            color = 0.6, 0.1, 0.1, 1.0 // Striking dark red orbital line in the tracking station
        }
        
        ScaledVersion
        {
            type = Atmospheric
            fadeStart = 90000
            fadeEnd = 100000
            
            Material
            {
                // Synchronized perfectly to mirror your exact file spelling!
                texture = Kerbopause-Mod/Niburum
                shininess = 0.1
                specular = 0.1, 0.1, 0.1, 1.0
            }
        }

        Atmosphere
        {
            enabled = true
            oxygen = false
            ambientColor = 0.6, 0.1, 0.1, 1.0 // Ominous deep red atmospheric light scatter
            altitude = 200000 // Deep, crushing atmospheric envelope
            
            gasColor = 0.5, 0.0, 0.0, 1.0
            unlit = false
        }
    }
}

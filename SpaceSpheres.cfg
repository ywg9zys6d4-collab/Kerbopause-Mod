// Save this file as: SpaceSpheres.cfg (Keep it in your root directory next to your textures)

@Kopernicus:FOR[Kerbopause-Mod]
{
    // ==========================================
    // 🔴 THE KERBOPAUSE SPHERE (Inner Boundary)
    // ==========================================
    Body
    {
        name = Kerbopause
        identifier = KP_Boundary
        
        Template
        {
            name = Jool // Uses Jool as an atmospheric base template
            removeAllPQSMods = true
        }
        
        Properties
        {
            displayName = The Kerbopause^N
            description = A colossal, highly energetic spherical shell wrapping around the solar system. It acts as the magnetic friction wall where solar winds meet interstellar space, now violently tearing open.
            radius = 1000 // Microscopic physical planet body hidden perfectly at the sun's center
            mass = 1
            geeASL = 0
            selectable = true
            OnDemand = false
        }
        
        Orbit
        {
            referenceBody = Sun
            semiMajorAxis = 1 // Sits permanently inside the core of the Sun
            eccentricity = 0
            inclination = 0
            color = 1, 0, 0, 1 // Red tracker lines
        }

        Atmosphere
        {
            enabled = true
            oxygen = false
            ambientColor = 1.0, 0.1, 0.1, 1.0 // Deep glowing pure red sphere
            
            // Colossal scale heights to project the atmosphere out past the planets
            altitude = 700000000000 // Huge spherical reach matching Sedurim's neighborhood
            atmosphereDepth = 50000000000 // Thickness of the glowing red wall
            
            // Makes the red glow visible from deep interstellar space
            gasColor = 1.0, 0.0, 0.0, 1.0
            unlit = true // Glows beautifully in the dark
        }
    }

    // ==========================================
    // ⚪ THE KERMAN CLOUD SPHERE (Outer 1 KLY Shield)
    // ==========================================
    Body
    {
        name = KermanCloud
        identifier = KC_Shield
        
        Template
        {
            name = Jool
            removeAllPQSMods = true
        }
        
        Properties
        {
            displayName = The Kerman Cloud^N
            description = A massive, icy spherical protective barrier 1 Kerbal Light Year thick. It shields the inner star system from the harsh environment of neighboring stars.
            radius = 1005 // Hidden safely at the sun's center
            mass = 1
            geeASL = 0
            selectable = true
            OnDemand = false
        }
        
        Orbit
        {
            referenceBody = Sun
            semiMajorAxis = 2 
            eccentricity = 0
            inclination = 0
            color = 1, 1, 1, 1 // Pure white tracker lines
        }

        Atmosphere
        {
            enabled = true
            oxygen = false
            ambientColor = 0.9, 0.9, 1.0, 1.0 // Frosty, snowy white appearance
            
            // Extends the atmosphere layer out to a massive scale
            altitude = 9500000000000 // Pushes the outer shell to a massive 1 KLY depth
            atmosphereDepth = 2000000000000 // Makes the cloud layer incredibly thick
            
            gasColor = 0.9, 0.9, 1.0, 0.6 // Translucent misty look
            unlit = true
        }
    }
}
